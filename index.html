<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Attendance Scanner</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 50px; }
        #reader { width: 400px; margin: 0 auto; }
        #result-card { display: none; margin-top: 20px; border: 1px solid #ccc; padding: 20px; border-radius: 8px; }
        #student-photo { max-width: 200px; border-radius: 8px; }
    </style>
</head>
<body>
    <h1>Student Attendance Scanner</h1>
    <a href="admin.html">Go to Admin Dashboard</a>
    
    <div id="reader"></div>
    
    <div id="result-card">
        <img id="student-photo" src="" alt="Student Photo">
        <h2 id="student-name"></h2>
        <h3 id="student-id"></h3>
        <p style="color: green;">Attendance Logged!</p>
    </div>

    <script src="app.js"></script>
    <script>
        // Initialize Scanner
        const html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
        let isProcessing = false;

        function onScanSuccess(decodedText) {
            if (isProcessing) return;
            isProcessing = true;
            html5QrcodeScanner.pause();

            const formData = new FormData();
            formData.append('action', 'scan');
            formData.append('id', decodedText);

            fetch(SCRIPT_URL, { method: 'POST', body: formData })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        document.getElementById('result-card').style.display = 'block';
                        document.getElementById('student-name').innerText = data.name;
                        document.getElementById('student-id').innerText = data.id;
                        document.getElementById('student-photo').src = data.photo;
                        
                        // Resume scanner after 3 seconds
                        setTimeout(() => {
                            document.getElementById('result-card').style.display = 'none';
                            html5QrcodeScanner.resume();
                            isProcessing = false;
                        }, 3000);
                    } else {
                        alert(data.message);
                        html5QrcodeScanner.resume();
                        isProcessing = false;
                    }
                });
        }
        html5QrcodeScanner.render(onScanSuccess);
    </script>
</body>
</html>
