<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>School Attendance Scanner</title>
    <!-- Scanner and Face Libraries -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.min.js"></script>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); /* Elegant School Blue */
            color: white; margin: 0; padding: 0; min-height: 100vh;
        }

        .header { background: rgba(0,0,0,0.3); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .header h1 { margin: 0; font-size: 22px; font-weight: 300; letter-spacing: 1px; }
        .btn-sync { background: #ff9800; color: white; border: none; padding: 8px 15px; border-radius: 20px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-sync:hover { background: #e68a00; transform: scale(1.05); }

        .main-container { max-width: 800px; margin: 40px auto; text-align: center; }

        /* The Viewfinder container */
        .scanner-wrapper {
            position: relative; width: 90%; max-width: 500px; margin: 0 auto;
            border-radius: 16px; overflow: hidden; background: #000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 4px solid rgba(255,255,255,0.1);
        }
        
        #reader, #face-video { width: 100%; display: block; }
        #face-video { transform: scaleX(-1); /* Mirror camera */ }

        /* Mode Switcher */
        .mode-switch { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .mode-btn { background: rgba(255,255,255,0.2); color: white; border: 2px solid transparent; padding: 10px 20px; border-radius: 30px; cursor: pointer; font-size: 16px; }
        .mode-btn.active { background: white; color: #1e3c72; border-color: white; font-weight: bold; }

        /* Pop-up Student Card Overlay */
        #result-card { 
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.95); z-index: 20; color: #333;
            flex-direction: column; align-items: center; justify-content: center;
        }

        .pop-in { animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes popIn { 0% { opacity: 0; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1); } }

        .status-badge { padding: 8px 20px; border-radius: 30px; font-weight: bold; color: white; font-size: 18px; margin-bottom: 15px; letter-spacing: 1px; text-transform: uppercase; }
        .status-in { background: #4CAF50; box-shadow: 0 4px 10px rgba(76,175,80,0.4); }
        .status-out { background: #f44336; box-shadow: 0 4px 10px rgba(244,67,54,0.4); }

        #student-photo { width: 220px; height: 220px; border-radius: 50%; object-fit: cover; border: 5px solid #1e3c72; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        #student-name { font-size: 28px; font-weight: 800; color: #1e3c72; margin: 15px 0 5px 0; }
        #scan-time { font-size: 16px; color: #666; font-weight: bold; }

        .admin-link { position: fixed; bottom: 20px; right: 20px; color: rgba(255,255,255,0.5); text-decoration: none; font-size: 14px; }
        .admin-link:hover { color: white; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎓 Campus Attendance</h1>
        <button class="btn-sync" onclick="syncData()">🔄 Sync DB</button>
    </div>

    <div class="main-container">
        
        <div class="mode-switch">
            <button class="mode-btn active" id="btn-qr" onclick="setMode('qr')">📱 Scan QR ID</button>
            <button class="mode-btn" id="btn-face" onclick="setMode('face')">👁️ Face Recognition</button>
        </div>

        <div class="scanner-wrapper">
            <!-- QR Scanner Div -->
            <div id="reader"></div>
            <!-- Face Scanner Video -->
            <video id="face-video" autoplay muted playsinline style="display:none;"></video>
            
            <div id="result-card">
                <div id="status-badge" class="status-badge"></div>
                <img id="student-photo" src="" alt="Student">
                <div id="student-name"></div>
                <div id="scan-time"></div>
            </div>
        </div>
        <p style="margin-top: 15px; color: rgba(255,255,255,0.7);" id="status-text">Ready to scan.</p>
    </div>

    <a href="admin.html" class="admin-link">⚙️ Admin</a>

    <script src="app.js"></script>
    <script>
        let isCooldown = false; 
        let displayTimeout = null; 
        let currentMode = 'qr';
        const html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
        
        // Face AI Data
        let faceMatcher = null;
        let faceInterval = null;

        // Initialize Audio
        let femaleVoice = null;
        window.speechSynthesis.onvoiceschanged = () => {
            const voices = window.speechSynthesis.getVoices();
            femaleVoice = voices.find(v => v.name.includes('Female') || v.name.includes('Samantha') || v.name.includes('Zira') || v.name.includes('Jenny')) || voices.find(v => v.lang.startsWith('en-'));
        };

        // Load models on startup
        Promise.all([
            faceapi.nets.ssdMobilenetv1.loadFromUri('https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/'),
            faceapi.nets.faceLandmark68Net.loadFromUri('https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/'),
            faceapi.nets.faceRecognitionNet.loadFromUri('https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/')
        ]).then(() => { buildFaceMatcher(); });

        function buildFaceMatcher() {
            const localData = JSON.parse(localStorage.getItem('localStudents') || '{}');
            const labeledDescriptors = [];
            for (let id in localData) {
                if (localData[id].face) {
                    const descArray = new Float32Array(JSON.parse(localData[id].face));
                    labeledDescriptors.push(new faceapi.LabeledFaceDescriptors(id, [descArray]));
                }
            }
            if(labeledDescriptors.length > 0) faceMatcher = new faceapi.FaceMatcher(labeledDescriptors, 0.55); // 0.55 is strictness
        }

        function syncData() {
            Swal.fire({ title: 'Downloading Database...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            const formData = new FormData(); formData.append('action', 'sync');
            fetch(SCRIPT_URL, { method: 'POST', body: formData })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        localStorage.setItem('localStudents', JSON.stringify(data.students));
                        buildFaceMatcher(); // Rebuild AI mapping
                        Swal.fire('Synced!', 'Database is up to date.', 'success');
                    }
                });
        }

        // --- MODE SWITCHING LOGIC ---
        function setMode(mode) {
            currentMode = mode;
            document.getElementById('btn-qr').classList.toggle('active', mode === 'qr');
            document.getElementById('btn-face').classList.toggle('active', mode === 'face');
            
            if(mode === 'qr') {
                document.getElementById('face-video').style.display = 'none';
                document.getElementById('reader').style.display = 'block';
                if(faceInterval) clearInterval(faceInterval);
                html5QrcodeScanner.resume();
            } else {
                document.getElementById('reader').style.display = 'none';
                document.getElementById('face-video').style.display = 'block';
                html5QrcodeScanner.pause();
                startFaceScanner();
            }
        }

        async function startFaceScanner() {
            if(!faceMatcher) {
                Swal.fire('No Faces Registered', 'Please sync the database or add students with photos in the admin panel first.', 'warning');
                setMode('qr'); return;
            }
            const video = document.getElementById('face-video');
            navigator.mediaDevices.getUserMedia({ video: true }).then(stream => { video.srcObject = stream; });
            
            document.getElementById('status-text').innerText = "Look into the camera...";
            
            faceInterval = setInterval(async () => {
                if(isCooldown) return;
                const detection = await faceapi.detectSingleFace(video).withFaceLandmarks().withFaceDescriptor();
                if(detection) {
                    const bestMatch = faceMatcher.findBestMatch(detection.descriptor);
                    if(bestMatch.label !== "unknown") {
                        processAttendance(bestMatch.label); // The label is the Student ID
                    }
                }
            }, 500); // Check every half second
        }

        // --- CORE SCAN LOGIC (Triggered by QR or Face) ---
        function processAttendance(studentId) {
            if (isCooldown) return;
            isCooldown = true;
            if(currentMode === 'qr') html5QrcodeScanner.pause();

            const localData = JSON.parse(localStorage.getItem('localStudents') || '{}');
            const student = localData[studentId];

            if (student) {
                if (displayTimeout) clearTimeout(displayTimeout);

                const card = document.getElementById('result-card');
                card.classList.remove('pop-in'); void card.offsetWidth; card.classList.add('pop-in');
                card.style.display = 'flex';

                const now = new Date();
                const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                // Check local history to toggle In/Out instantly for UI (backend handles true log)
                const history = JSON.parse(localStorage.getItem('attHistory') || '{}');
                let status = history[studentId] === 'Arrived' ? 'Left' : 'Arrived';
                history[studentId] = status;
                localStorage.setItem('attHistory', JSON.stringify(history));

                // Audio Announce
                window.speechSynthesis.cancel();
                const speech = new SpeechSynthesisUtterance(`${student.name}, ${status}`);
                if (femaleVoice) speech.voice = femaleVoice;
                speech.rate = 0.9; speech.pitch = 1.1;
                window.speechSynthesis.speak(speech);

                // Update UI
                const badge = document.getElementById('status-badge');
                badge.innerText = status === 'Arrived' ? "🟢 Time In" : "🔴 Time Out";
                badge.className = status === 'Arrived' ? "status-badge status-in" : "status-badge status-out";
                
                document.getElementById('scan-time').innerText = timeString;
                document.getElementById('student-name').innerText = student.name;
                document.getElementById('student-photo').src = student.photo;

                // Push log & trigger email in background
                const logData = new FormData();
                logData.append('action', 'log');
                logData.append('id', studentId);
                logData.append('name', student.name);
                logData.append('email', student.email || ""); // Send email to backend
                fetch(SCRIPT_URL, { method: 'POST', body: logData });

                setTimeout(() => { if(currentMode==='qr') html5QrcodeScanner.resume(); isCooldown = false; }, 3000); // 3 sec cooldown
                displayTimeout = setTimeout(() => { card.style.display = 'none'; }, 300000); // Overlay lasts 5 min

            } else {
                Swal.fire({ icon: 'error', title: 'Invalid ID', text: `ID ${studentId} not found in system.`, timer: 2000, showConfirmButton: false });
                setTimeout(() => { if(currentMode==='qr') html5QrcodeScanner.resume(); isCooldown = false; }, 2000);
            }
        }
        
        // Start QR by default
        html5QrcodeScanner.render((decodedText) => { processAttendance(decodedText); });
    </script>
</body>
</html>
