<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>School Attendance Scanner</title>
    <!-- Scanner and Face Libraries -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.min.js"></script>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); 
            color: white; margin: 0; padding: 0; min-height: 100vh;
        }

        .header { background: rgba(0,0,0,0.3); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .header h1 { margin: 0; font-size: 22px; font-weight: 300; letter-spacing: 1px; }
        .btn-sync { background: #ff9800; color: white; border: none; padding: 8px 15px; border-radius: 20px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-sync:hover { background: #e68a00; transform: scale(1.05); }

        .main-container { max-width: 900px; margin: 40px auto; text-align: center; }

        /* The Viewfinder container */
        .scanner-wrapper {
            position: relative; width: 90%; max-width: 500px; margin: 0 auto;
            border-radius: 16px; overflow: hidden; background: #000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 4px solid rgba(255,255,255,0.1);
        }
        
        #reader, #face-video { width: 100%; display: block; }
        #face-video { transform: scaleX(-1); }

        /* Mode Switcher */
        .mode-switch { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .mode-btn { background: rgba(255,255,255,0.2); color: white; border: 2px solid transparent; padding: 10px 20px; border-radius: 30px; cursor: pointer; font-size: 16px; }
        .mode-btn.active { background: white; color: #1e3c72; border-color: white; font-weight: bold; }

        /* Pop-up Student Card Overlay */
        #result-card { 
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.95); z-index: 20; color: #333;
            flex-direction: column; align-items: center; justify-content: center;
        }

        .pop-in { animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes popIn { 0% { opacity: 0; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1); } }

        .status-badge { padding: 8px 20px; border-radius: 30px; font-weight: bold; color: white; font-size: 18px; margin-bottom: 15px; letter-spacing: 1px; text-transform: uppercase; }
        .status-in { background: #4CAF50; box-shadow: 0 4px 10px rgba(76,175,80,0.4); }
        .status-out { background: #f44336; box-shadow: 0 4px 10px rgba(244,67,54,0.4); }

        #student-photo { width: 220px; height: 220px; border-radius: 50%; object-fit: cover; border: 5px solid #1e3c72; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        #student-name { font-size: 28px; font-weight: 800; color: #1e3c72; margin: 15px 0 5px 0; }
        #scan-time { font-size: 16px; color: #666; font-weight: bold; }
        #status-text { margin-top: 15px; font-size: 18px; font-weight: bold; color: #ffeb3b; }

        /* --- NEW RESPONSIVE RECENT SCANS GRID --- */
        .recent-section {
            margin-top: 40px; width: 95%; max-width: 900px; margin-left: auto; margin-right: auto;
            background: rgba(255,255,255,0.1); padding: 20px; border-radius: 16px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2); text-align: left;
        }
        .recent-title { color: white; font-size: 18px; font-weight: bold; margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.3); padding-bottom: 10px; }
        
        /* Auto-adjusts columns based on width */
        .recent-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 12px;
        }
        
        .mini-card {
            background: white; border-radius: 12px; padding: 12px 8px;
            display: flex; flex-direction: column; align-items: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3); color: #333;
        }
        .mini-card img { width: 65px; height: 65px; border-radius: 50%; object-fit: cover; border: 3px solid #1e3c72; margin-bottom: 8px; }
        .mini-name { font-size: 12px; font-weight: bold; text-align: center; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .mini-time { font-size: 10px; color: #888; margin-top: 2px; }
        .mini-status { font-size: 10px; font-weight: bold; padding: 2px 8px; border-radius: 10px; margin-top: 6px; color: white; }
        
        .admin-link { position: fixed; bottom: 20px; right: 20px; color: rgba(255,255,255,0.5); text-decoration: none; font-size: 14px; }
        .admin-link:hover { color: white; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎓 Campus Attendance</h1>
        <button class="btn-sync" onclick="syncData()">🔄 Sync DB</button>
    </div>

    <div class="main-container">
        
        <div class="mode-switch">
            <button class="mode-btn active" id="btn-qr" onclick="setMode('qr')">📱 Scan QR ID</button>
            <button class="mode-btn" id="btn-face" onclick="setMode('face')">👁️ Face Recognition</button>
        </div>

        <div class="scanner-wrapper">
            <div id="reader"></div>
            <video id="face-video" autoplay muted playsinline style="display:none;"></video>
            
            <div id="result-card">
                <div id="status-badge" class="status-badge"></div>
                <img id="student-photo" src="" alt="Student">
                <div id="student-name"></div>
                <div id="scan-time"></div>
            </div>
        </div>
        <p id="status-text">System Ready. Please Sync DB first.</p>
        
        <!-- NEW HISTORY GRID -->
        <div class="recent-section">
            <div class="recent-title">Recent Scans Today</div>
            <div class="recent-grid" id="recent-grid">
                <!-- Mini ID cards will populate here dynamically -->
            </div>
        </div>
    </div>

    <a href="admin.html" class="admin-link">⚙️ Admin Dashboard</a>

    <script src="app.js"></script>
    <script>
        let isCooldown = false; 
        let displayTimeout = null; 
        let currentMode = 'qr';
        const html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
        
        let faceMatcher = null;
        let faceInterval = null;

        // --- NEW: COOLDOWN MEMORY (5 MINUTES PER STUDENT) ---
        let studentCooldowns = {}; 
        
        let femaleVoice = null;
        window.speechSynthesis.onvoiceschanged = () => {
            const voices = window.speechSynthesis.getVoices();
            femaleVoice = voices.find(v => v.name.includes('Female') || v.name.includes('Samantha') || v.name.includes('Zira') || v.name.includes('Jenny')) || voices.find(v => v.lang.startsWith('en-'));
        };

        const MODEL_URL = 'https://justadudewhohacks.github.io/face-api.js/models';
        Promise.all([
            faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL),
            faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
            faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
        ]).then(() => { 
            document.getElementById('status-text').innerText = "AI Models Loaded. Ready.";
            buildFaceMatcher(); 
            renderRecentScans(); // Load cards on startup
        });

        function buildFaceMatcher() {
            const localData = JSON.parse(localStorage.getItem('localStudents') || '{}');
            const labeledDescriptors = [];
            for (let id in localData) {
                if (localData[id].face) {
                    const descArray = new Float32Array(JSON.parse(localData[id].face));
                    labeledDescriptors.push(new faceapi.LabeledFaceDescriptors(id, [descArray]));
                }
            }
            if(labeledDescriptors.length > 0) faceMatcher = new faceapi.FaceMatcher(labeledDescriptors, 0.6); 
        }

        function syncData() {
            Swal.fire({ title: 'Downloading Database...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            const formData = new FormData(); formData.append('action', 'sync');
            fetch(SCRIPT_URL, { method: 'POST', body: formData })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        localStorage.setItem('localStudents', JSON.stringify(data.students));
                        buildFaceMatcher(); 
                        document.getElementById('status-text').innerText = "Database Synced!";
                        Swal.fire('Synced!', 'Database is up to date.', 'success');
                    }
                });
        }

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('btn-qr').classList.toggle('active', mode === 'qr');
            document.getElementById('btn-face').classList.toggle('active', mode === 'face');
            
            if(mode === 'qr') {
                document.getElementById('face-video').style.display = 'none';
                document.getElementById('reader').style.display = 'block';
                document.getElementById('status-text').innerText = "Show QR Code to camera";
                if(faceInterval) clearInterval(faceInterval);
                html5QrcodeScanner.resume();
            } else {
                document.getElementById('reader').style.display = 'none';
                document.getElementById('face-video').style.display = 'block';
                html5QrcodeScanner.pause();
                startFaceScanner();
            }
        }

        async function startFaceScanner() {
            if(!faceMatcher) {
                Swal.fire('No Faces Registered', 'Please sync the database or add students with photos in the admin panel first.', 'warning');
                setMode('qr'); return;
            }
            const video = document.getElementById('face-video');
            navigator.mediaDevices.getUserMedia({ video: true }).then(stream => { video.srcObject = stream; });
            
            document.getElementById('status-text').innerText = "Looking for a face...";
            document.getElementById('status-text').style.color = "#ffeb3b"; 
            
            faceInterval = setInterval(async () => {
                if(isCooldown) return;
                const detection = await faceapi.detectSingleFace(video).withFaceLandmarks().withFaceDescriptor();
                
                if(detection) {
                    const bestMatch = faceMatcher.findBestMatch(detection.descriptor);
                    if(bestMatch.label !== "unknown") {
                        processAttendance(bestMatch.label); 
                    } else {
                        document.getElementById('status-text').innerText = "❌ Face seen, but unknown.";
                        document.getElementById('status-text').style.color = "#f44336"; 
                    }
                } else {
                    document.getElementById('status-text').innerText = "Looking for a face...";
                    document.getElementById('status-text').style.color = "#ffeb3b"; 
                }
            }, 600); 
        }

        function processAttendance(studentId) {
            if (isCooldown) return;

            const nowTime = new Date().getTime();
            const FIVE_MINUTES = 5 * 60 * 1000;

            // --- CHECK 5 MINUTE COOLDOWN FOR THIS SPECIFIC STUDENT ---
            if (studentCooldowns[studentId] && (nowTime - studentCooldowns[studentId] < FIVE_MINUTES)) {
                // If it's a QR scan, show a popup warning. (Face scans fail silently so it doesn't spam).
                if (currentMode === 'qr') {
                    Swal.fire({ toast: true, position: 'top-end', icon: 'warning', title: `Wait 5 minutes before scanning again.`, showConfirmButton: false, timer: 3000 });
                }
                return; // Stop processing and drop the frame
            }

            // Lock camera momentarily to process UI
            isCooldown = true;
            if(currentMode === 'qr') html5QrcodeScanner.pause();

            const localData = JSON.parse(localStorage.getItem('localStudents') || '{}');
            const student = localData[studentId];

            if (student) {
                // Record the cooldown time for this student
                studentCooldowns[studentId] = nowTime;

                if (displayTimeout) clearTimeout(displayTimeout);

                const card = document.getElementById('result-card');
                card.classList.remove('pop-in'); void card.offsetWidth; card.classList.add('pop-in');
                card.style.display = 'flex';

                const now = new Date();
                const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                const history = JSON.parse(localStorage.getItem('attHistory') || '{}');
                let status = history[studentId] === 'Arrived' ? 'Left' : 'Arrived';
                history[studentId] = status;
                localStorage.setItem('attHistory', JSON.stringify(history));

                window.speechSynthesis.cancel();
                const speech = new SpeechSynthesisUtterance(`${student.name}, ${status}`);
                if (femaleVoice) speech.voice = femaleVoice;
                speech.rate = 0.9; speech.pitch = 1.1;
                window.speechSynthesis.speak(speech);

                const badge = document.getElementById('status-badge');
                badge.innerText = status === 'Arrived' ? "🟢 Time In" : "🔴 Time Out";
                badge.className = status === 'Arrived' ? "status-badge status-in" : "status-badge status-out";
                
                document.getElementById('scan-time').innerText = timeString;
                document.getElementById('student-name').innerText = student.name;
                document.getElementById('student-photo').src = student.photo;

                // --- UPDATE THE RECENT SCANS GRID ---
                let recentCards = JSON.parse(localStorage.getItem('recentCards') || '[]');
                recentCards.unshift({ name: student.name, photo: student.photo, status: status, time: timeString });
                if (recentCards.length > 24) recentCards.pop(); // Keep the last 24 scans in the grid
                localStorage.setItem('recentCards', JSON.stringify(recentCards));
                renderRecentScans();

                const logData = new FormData();
                logData.append('action', 'log');
                logData.append('id', studentId);
                logData.append('name', student.name);
                logData.append('email', student.email || ""); 
                fetch(SCRIPT_URL, { method: 'POST', body: logData });

                document.getElementById('status-text').innerText = `✅ ${student.name} Logged!`;
                document.getElementById('status-text').style.color = "#4CAF50";

                // Resume camera after 2.5 seconds to look for the NEXT person
                setTimeout(() => { 
                    if(currentMode==='qr') html5QrcodeScanner.resume(); 
                    isCooldown = false; 
                }, 2500); 
                
                // Clear the main overlay picture after 5 minutes (unless interrupted by a new scan)
                displayTimeout = setTimeout(() => { card.style.display = 'none'; }, 300000); 

            } else {
                Swal.fire({ icon: 'error', title: 'Invalid ID', text: `ID ${studentId} not found.`, timer: 2000, showConfirmButton: false });
                setTimeout(() => { if(currentMode==='qr') html5QrcodeScanner.resume(); isCooldown = false; }, 2000);
            }
        }

        function renderRecentScans() {
            const grid = document.getElementById('recent-grid');
            grid.innerHTML = '';
            const recentCards = JSON.parse(localStorage.getItem('recentCards') || '[]');
            
            recentCards.forEach(scan => {
                const badgeClass = scan.status === 'Arrived' ? 'mini-in' : 'mini-out';
                const badgeText = scan.status === 'Arrived' ? 'IN' : 'OUT';
                grid.innerHTML += `
                    <div class="mini-card">
                        <img src="${scan.photo}">
                        <div class="mini-name">${scan.name}</div>
                        <div class="mini-time">${scan.time}</div>
                        <div class="mini-status ${badgeClass}">${badgeText}</div>
                    </div>
                `;
            });
        }
        
        html5QrcodeScanner.render((decodedText) => { processAttendance(decodedText); });
    </script>
</body>
</html>
