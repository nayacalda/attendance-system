<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin - School Attendance</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        h1 { text-align: center; color: #1a73e8; }
        input, button, select { width: 100%; margin: 10px 0; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        input:focus { outline: none; border-color: #1a73e8; box-shadow: 0 0 5px rgba(26,115,232,0.3); }
        button { background: #1a73e8; color: white; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #1557b0; transform: translateY(-1px); }
        
        .btn-secondary { background: #e0e0e0; color: #333; }
        .btn-secondary:hover { background: #d0d0d0; }
        
        .tabs { display: flex; margin-bottom: 20px; }
        .tab { flex: 1; text-align: center; padding: 10px; background: #f0f0f0; cursor: pointer; font-weight: bold; border-bottom: 3px solid transparent; }
        .tab.active { border-bottom: 3px solid #1a73e8; color: #1a73e8; background: white; }

        /* --- NEW: SMART AUTO-CAPTURE WIZARD UI --- */
        #camera-wrapper { 
            position: relative; width: 100%; max-width: 400px; margin: 15px auto; 
            overflow: hidden; border-radius: 12px; display: none; background: #000; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); 
        }
        #video { width: 100%; display: block; transform: scaleX(-1); /* Mirror camera */ }
        
        /* The Darkened Oval Cutout Guide */
        .face-guide {
            position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%);
            width: 200px; height: 260px; border: 4px dashed #3B82F6; border-radius: 50%;
            box-shadow: 0 0 0 2000px rgba(0,0,0,0.7); pointer-events: none; z-index: 10;
            transition: 0.3s;
        }
        
        /* Success state when aligned */
        .guide-success { 
            border-color: #10B981 !important; border-style: solid !important; 
            box-shadow: 0 0 20px #10B981, 0 0 0 2000px rgba(0,0,0,0.7) !important; 
        }

        /* Bouncing Arrow Indicators */
        .arrow-indicator {
            position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%);
            font-size: 60px; z-index: 20; animation: pulseArrow 1s infinite;
            text-shadow: 0px 4px 10px rgba(0,0,0,0.5); pointer-events: none;
        }
        @keyframes pulseArrow { 
            0% { opacity: 0.6; transform: translate(-50%, -50%) scale(0.9); } 
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); } 
            100% { opacity: 0.6; transform: translate(-50%, -50%) scale(0.9); } 
        }

        /* Bottom Text & Progress Bar */
        .wizard-footer { position: absolute; bottom: 0; left: 0; width: 100%; background: rgba(0,0,0,0.6); z-index: 15; padding: 10px 0; }
        #wizard-text { text-align: center; color: white; font-weight: bold; font-size: 16px; margin-bottom: 5px; }
        .progress-bar-bg { width: 80%; height: 6px; background: rgba(255,255,255,0.2); margin: 0 auto; border-radius: 3px; overflow: hidden; }
        #hold-progress { width: 0%; height: 100%; background: #10B981; transition: width 0.1s linear; }

        /* Camera Flash Effect */
        #flash-overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 100; opacity: 0.8; }

        /* Progress Dots */
        .step-dots { display: flex; justify-content: center; gap: 8px; margin-top: 15px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; background: #ddd; }
        .dot.active { background: #1a73e8; box-shadow: 0 0 5px #1a73e8; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Admin Portal</h1>
        <a href="index.html" style="display:block; text-align:center; margin-bottom:20px; color:#666;">Back to Scanner</a>

        <div id="login-section">
            <input type="text" id="username" placeholder="Admin Username">
            <input type="password" id="password" placeholder="Password">
            <button onclick="login()">Access System</button>
        </div>

        <div id="admin-section" style="display: none;">
            <div class="tabs">
                <div class="tab active" onclick="switchTab('add')" id="tab-add">Add Student</div>
                <div class="tab" onclick="switchTab('edit')" id="tab-edit">Edit Student</div>
            </div>

            <select id="edit-selector" style="display:none;" onchange="loadStudentToEdit()"></select>

            <input type="text" id="student-id" placeholder="Student ID Number (e.g. 1001)">
            <input type="text" id="student-name" placeholder="Full Legal Name">
            <input type="email" id="student-email" placeholder="Student Email (For Notifications)">
            
            <p style="font-size: 14px; color: gray; margin-bottom: 0;">Multi-Angle Biometric Registration:</p>
            
            <button class="btn-secondary" onclick="startCamera()" id="start-cam-btn">🤖 Start Auto-Capture AI</button>
            
            <!-- SMART GUIDED CAMERA UI -->
            <div id="camera-wrapper">
                <video id="video" autoplay playsinline></video>
                <div class="face-guide" id="face-guide"></div>
                <div class="arrow-indicator" id="arrow-indicator">🎯</div>
                <div id="flash-overlay"></div>
                
                <div class="wizard-footer">
                    <div id="wizard-text">Loading AI...</div>
                    <div class="progress-bar-bg"><div id="hold-progress"></div></div>
                </div>
            </div>
            
            <div class="step-dots" id="step-dots" style="display:none;">
                <div class="dot active" id="dot-0"></div>
                <div class="dot" id="dot-1"></div>
                <div class="dot" id="dot-2"></div>
            </div>
            
            <button class="btn-secondary" onclick="document.getElementById('file-upload').click()" id="upload-btn">📁 Or Upload Picture (Lower Accuracy)</button>
            <input type="file" id="file-upload" accept="image/*" style="display:none;" onchange="handleFileUpload(event)">
            
            <canvas id="canvas" style="display:none;"></canvas>
            <img id="preview" style="display:none; max-width: 200px; margin: 15px auto; border-radius: 8px; border: 3px solid #10B981;">
            <p id="face-status" style="text-align: center; font-weight: bold; color: orange; font-size: 14px;"></p>
            
            <button onclick="saveStudent()" id="save-btn">Save New Student</button>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        let capturedPhotoBase64 = "";
        let faceDescriptorData = ""; 
        let multiDescriptors = []; 
        let captureStepIndex = 0;
        let currentMode = 'add';
        let localData = {};
        
        // Auto-Capture variables
        let framesHeld = 0;
        const FRAMES_REQUIRED = 12; // About 1 second of holding still
        let isCapturing = false;

        const MODEL_URL = 'https://justadudewhohacks.github.io/face-api.js/models';
        Promise.all([
            faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL),
            faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
            faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
        ]).then(() => { console.log("Biometric AI Loaded"); });

        function login() {
            Swal.fire({ title: 'Authenticating...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            const formData = new FormData(); formData.append('action', 'login');
            formData.append('user', document.getElementById('username').value);
            formData.append('pass', document.getElementById('password').value);
            fetch(SCRIPT_URL, { method: 'POST', body: formData }).then(res => res.json()).then(data => {
                if (data.success) {
                    Swal.close();
                    document.getElementById('login-section').style.display = 'none'; document.getElementById('admin-section').style.display = 'block';
                    fetchLocalData();
                } else Swal.fire('Access Denied', 'Invalid Credentials', 'error');
            });
        }

        function fetchLocalData() {
            const formData = new FormData(); formData.append('action', 'sync');
            fetch(SCRIPT_URL, { method: 'POST', body: formData }).then(res => res.json()).then(data => { localData = data.students; updateEditDropdown(); });
        }

        function switchTab(mode) {
            currentMode = mode;
            document.getElementById('tab-add').classList.toggle('active', mode === 'add'); document.getElementById('tab-edit').classList.toggle('active', mode === 'edit');
            document.getElementById('edit-selector').style.display = mode === 'edit' ? 'block' : 'none'; document.getElementById('student-id').disabled = mode === 'edit';
            document.getElementById('save-btn').innerText = mode === 'add' ? 'Save New Student' : 'Update Student';
            if(mode === 'add') clearForm();
        }

        function updateEditDropdown() {
            const sel = document.getElementById('edit-selector'); sel.innerHTML = '<option value="">-- Select Student to Edit --</option>';
            for (let id in localData) { sel.innerHTML += `<option value="${id}">${id} - ${localData[id].name}</option>`; }
        }

        function loadStudentToEdit() {
            const id = document.getElementById('edit-selector').value; if(!id) return clearForm();
            const s = localData[id];
            document.getElementById('student-id').value = id; document.getElementById('student-name').value = s.name;
            document.getElementById('student-email').value = s.email || ''; document.getElementById('preview').src = s.photo;
            document.getElementById('preview').style.display = 'block'; capturedPhotoBase64 = s.photo; faceDescriptorData = ""; 
            document.getElementById('face-status').innerText = "Current photo loaded. Take new photos to update biometrics.";
            document.getElementById('face-status').style.color = "blue";
        }

        function clearForm() {
            document.getElementById('student-id').value = ''; document.getElementById('student-name').value = '';
            document.getElementById('student-email').value = ''; document.getElementById('preview').style.display = 'none';
            document.getElementById('face-status').innerText = ''; capturedPhotoBase64 = ""; faceDescriptorData = "";
        }

        // --- NEW: INITIATE SMART AUTO-CAPTURE LOOP ---
        function startCamera() {
            navigator.mediaDevices.getUserMedia({ video: true }).then(stream => { 
                const video = document.getElementById('video');
                video.srcObject = stream; 
                
                multiDescriptors = []; captureStepIndex = 0; framesHeld = 0; isCapturing = false;
                
                document.getElementById('camera-wrapper').style.display = 'block';
                document.getElementById('step-dots').style.display = 'flex';
                document.getElementById('start-cam-btn').style.display = 'none';
                document.getElementById('upload-btn').style.display = 'none';
                
                // Start the AI loop once video plays
                video.onplay = () => requestAnimationFrame(autoCaptureLoop);
            });
        }

        async function autoCaptureLoop() {
            if (document.getElementById('camera-wrapper').style.display === 'none') return; // Stop loop if hidden
            
            const video = document.getElementById('video');
            if (video.paused || video.ended || isCapturing) return;

            // Detect Face AND extract landmarks to check head rotation
            const detection = await faceapi.detectSingleFace(video).withFaceLandmarks().withFaceDescriptor();
            
            const text = document.getElementById('wizard-text');
            const guide = document.getElementById('face-guide');
            const arrow = document.getElementById('arrow-indicator');
            const progress = document.getElementById('hold-progress');
            
            // Update UI Dots
            document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === captureStepIndex));

            let targetPose = captureStepIndex === 0 ? "straight" : (captureStepIndex === 1 ? "left" : "right");

            if (detection) {
                // Determine Head Rotation using Landmarks (Nose distance to jawlines)
                const nose = detection.landmarks.getNose()[3];
                const leftJaw = detection.landmarks.getJawOutline()[0];
                const rightJaw = detection.landmarks.getJawOutline()[16];
                
                const leftDist = nose.x - leftJaw.x;
                const rightDist = rightJaw.x - nose.x;
                const ratio = leftDist / (rightDist || 1); // Avoid div by zero

                let currentPose = "straight";
                // Tolerances for detecting rotation
                if (ratio < 0.75) currentPose = "left";
                else if (ratio > 1.35) currentPose = "right";

                if (currentPose === targetPose) {
                    // FACE IS ALIGNED!
                    framesHeld++;
                    guide.classList.add('guide-success');
                    arrow.style.display = 'none';
                    text.innerText = "Perfect! Hold still...";
                    progress.style.width = (framesHeld / FRAMES_REQUIRED) * 100 + "%";

                    if (framesHeld >= FRAMES_REQUIRED) {
                        isCapturing = true;
                        await processCapture(detection, video); 
                    }
                } else {
                    // Face found, but wrong angle. Tell them where to look.
                    framesHeld = 0;
                    guide.classList.remove('guide-success');
                    progress.style.width = "0%";
                    arrow.style.display = 'block';
                    
                    if (targetPose === "straight") {
                        text.innerText = "Step 1: Look Straight at camera";
                        arrow.innerHTML = "🎯";
                    } else if (targetPose === "left") {
                        text.innerText = "Step 2: Turn head slightly LEFT";
                        arrow.innerHTML = "⬅️";
                    } else if (targetPose === "right") {
                        text.innerText = "Step 3: Turn head slightly RIGHT";
                        arrow.innerHTML = "➡️";
                    }
                }
            } else {
                // No Face Detected
                framesHeld = 0;
                progress.style.width = "0%";
                guide.classList.remove('guide-success');
                text.innerText = "No face detected. Get inside the oval.";
                arrow.style.display = 'none';
            }

            // Loop
            if (captureStepIndex < 3) {
                requestAnimationFrame(autoCaptureLoop);
            }
        }

        async function processCapture(detection, video) {
            // Screen Flash effect
            const flash = document.getElementById('flash-overlay');
            flash.style.display = 'block';
            setTimeout(() => flash.style.display = 'none', 100);

            if (captureStepIndex === 0) {
                // Save front-facing photo as Profile Picture
                const box = detection.detection.box;
                const canvas = document.getElementById('canvas');
                canvas.width = video.videoWidth; canvas.height = video.videoHeight;
                
                // Draw RAW unmirrored video to extract proper crop
                canvas.getContext('2d').drawImage(video, 0, 0);
                
                const cropCanvas = document.createElement('canvas');
                cropCanvas.width = 250; cropCanvas.height = 250;
                
                // Draw mirrored final crop so it matches what user saw on screen
                const cropCtx = cropCanvas.getContext('2d');
                cropCtx.translate(250, 0); cropCtx.scale(-1, 1);
                cropCtx.drawImage(canvas, box.x - 50, box.y - 50, box.width + 100, box.height + 100, 0, 0, 250, 250);
                
                capturedPhotoBase64 = cropCanvas.toDataURL('image/jpeg', 0.8);
            }

            multiDescriptors.push(Array.from(detection.descriptor));
            captureStepIndex++;
            framesHeld = 0;

            if (captureStepIndex >= 3) {
                // Finished all 3 angles!
                faceDescriptorData = JSON.stringify(multiDescriptors);
                document.getElementById('preview').src = capturedPhotoBase64;
                document.getElementById('preview').style.display = 'block';
                document.getElementById('face-status').innerText = "✅ Smart Biometrics Successfully Registered!";
                document.getElementById('face-status').style.color = "green";
                
                video.srcObject.getTracks().forEach(track => track.stop()); 
                document.getElementById('camera-wrapper').style.display = 'none';
                document.getElementById('step-dots').style.display = 'none';
                
                document.getElementById('start-cam-btn').style.display = 'block';
                document.getElementById('start-cam-btn').innerText = "📷 Retake Photos";
                Swal.fire({ icon: 'success', title: 'Complete!', toast: true, position: 'top-end', timer: 2000, showConfirmButton: false });
            } else {
                // Pause for 1 second before tracking the next angle
                setTimeout(() => { 
                    isCapturing = false; 
                    requestAnimationFrame(autoCaptureLoop); 
                }, 1000);
            }
        }

        async function handleFileUpload(e) {
            const file = e.target.files[0]; if (!file) return;
            const img = new Image(); img.src = URL.createObjectURL(file);
            img.onload = async () => {
                document.getElementById('face-status').innerText = "Analyzing...";
                const detection = await faceapi.detectSingleFace(img).withFaceLandmarks().withFaceDescriptor();
                if (detection) {
                    const canvas = document.getElementById('canvas'); canvas.width = 250; canvas.height = 250;
                    canvas.getContext('2d').drawImage(img, 0, 0, 250, 250);
                    capturedPhotoBase64 = canvas.toDataURL('image/jpeg', 0.8);
                    faceDescriptorData = JSON.stringify([Array.from(detection.descriptor)]);
                    
                    document.getElementById('preview').src = capturedPhotoBase64; document.getElementById('preview').style.display = 'block';
                    document.getElementById('face-status').innerText = "✅ Single-Angle Biometric Extracted"; document.getElementById('face-status').style.color = "green";
                } else { Swal.fire('Error', 'No face found.', 'error'); }
            }
        }

        function saveStudent() {
            const id = document.getElementById('student-id').value; const name = document.getElementById('student-name').value;
            const email = document.getElementById('student-email').value;
            if (!id || !name || !capturedPhotoBase64) return Swal.fire('Missing Info', 'ID, Name, and Photo are required.', 'warning');
            if (currentMode === 'add' && localData[id]) return Swal.fire('Error', 'Duplicate ID.', 'error');

            Swal.fire({ title: 'Saving Data...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            const formData = new FormData(); formData.append('action', currentMode === 'add' ? 'addStudent' : 'editStudent');
            formData.append('id', id); formData.append('name', name); formData.append('email', email); formData.append('photo', capturedPhotoBase64);
            if(faceDescriptorData) formData.append('face', faceDescriptorData);

            fetch(SCRIPT_URL, { method: 'POST', body: formData }).then(res => res.json()).then(data => {
                if (data.success) {
                    Swal.fire('Success!', `Student ${currentMode === 'add' ? 'Added' : 'Updated'}`, 'success');
                    fetchLocalData(); if(currentMode === 'add') clearForm();
                }
            });
        }
    </script>
</body>
</html>
