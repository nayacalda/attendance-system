<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <style>
        body { font-family: sans-serif; max-width: 500px; margin: 50px auto; padding: 20px; }
        .section { display: none; border: 1px solid #ccc; padding: 20px; border-radius: 8px; margin-top: 20px; }
        input, button { display: block; width: 100%; margin: 10px 0; padding: 10px; box-sizing: border-box; }
        video { width: 100%; border: 1px solid #ccc; margin-top: 10px; }
    </style>
</head>
<body>
    <h1>Admin Panel</h1>
    <a href="index.html">Back to Scanner</a>

    <!-- Login Section -->
    <div id="login-section" style="display: block;">
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <button onclick="login()">Login</button>
    </div>

    <!-- Add Student Section -->
    <div id="admin-section" class="section">
        <h2>Add New Student</h2>
        <input type="text" id="new-id" placeholder="Student ID Number">
        <input type="text" id="new-name" placeholder="Full Name">
        
        <h3>Capture Photo</h3>
        <button onclick="startCamera()">Start Camera</button>
        <video id="video" autoplay></video>
        <button onclick="capturePhoto()">Capture</button>
        <canvas id="canvas" style="display:none;"></canvas>
        <img id="preview" style="display:none; max-width: 100%; margin-top: 10px;">
        
        <button onclick="saveStudent()" style="background: blue; color: white;">Save Student Data</button>
    </div>

    <script src="app.js"></script>
    <script>
        let capturedPhotoBase64 = "";

        function login() {
            const formData = new FormData();
            formData.append('action', 'login');
            formData.append('user', document.getElementById('username').value);
            formData.append('pass', document.getElementById('password').value);

            fetch(SCRIPT_URL, { method: 'POST', body: formData })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        document.getElementById('login-section').style.display = 'none';
                        document.getElementById('admin-section').style.display = 'block';
                    } else {
                        alert("Invalid Credentials");
                    }
                });
        }

        function startCamera() {
            navigator.mediaDevices.getUserMedia({ video: true })
                .then(stream => { document.getElementById('video').srcObject = stream; })
                .catch(err => console.error("Camera error:", err));
        }

        function capturePhoto() {
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            
            // Convert to base64 jpeg
            capturedPhotoBase64 = canvas.toDataURL('image/jpeg', 0.8);
            
            const preview = document.getElementById('preview');
            preview.src = capturedPhotoBase64;
            preview.style.display = 'block';
        }

        function saveStudent() {
            if (!capturedPhotoBase64) return alert("Capture a photo first!");
            
            const formData = new FormData();
            formData.append('action', 'addStudent');
            formData.append('id', document.getElementById('new-id').value);
            formData.append('name', document.getElementById('new-name').value);
            formData.append('photo', capturedPhotoBase64);

            fetch(SCRIPT_URL, { method: 'POST', body: formData })
                .then(res => res.json())
                .then(data => {
                    alert(data.message);
                    if (data.success) {
                        document.getElementById('new-id').value = '';
                        document.getElementById('new-name').value = '';
                        document.getElementById('preview').style.display = 'none';
                        capturedPhotoBase64 = '';
                    }
                });
        }
    </script>
</body>
</html>
